<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}MediLedger{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body>
<header><a class="brand" href="{{ url_for('dashboard') }}">✚ MediLedger</a>{% if g.user %}<nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('bills') }}">Bills</a><a href="{{ url_for('analytics') }}">Analytics</a><a href="{{ url_for('profile') }}">Profile</a><a class="btn small" href="{{ url_for('scan') }}">📷 Scan bill</a><a href="{{ url_for('logout') }}">Logout</a></nav>{% endif %}</header><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{url_for('static',filename='app.js')}}"></script></body></html>
